<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель керування ТБ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; color: #1a5276; margin-bottom: 30px; }

        /* Сітка плиток як на макеті */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tile {
            background: #1a5276; /* Синій колір з макету */
            color: white;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.2s, background 0.2s;
            text-align: center;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tile:hover { transform: translateY(-5px); background: #2471a3; }
        .tile.active { border: 4px solid #f1c40f; }

        /* Форма редагування */
        .editor-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            display: none; /* З'являється при кліку */
            margin-bottom: 40px;
        }

        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #95a5a6; margin-top: 5px; }

        /* Список черги */
        .queue-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 6px solid #1a5276;
        }
        .actions button { width: auto; padding: 5px 15px; margin: 0 0 0 5px; font-size: 14px; }
        .del { background: #e74c3c; }
        .edit { background: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛 ПАНЕЛЬ КЕРУВАННЯ ТАБЛО</h1>

    <div class="dashboard">
        <div class="tile" onclick="openEditor('карта')">КАРТА</div>
        <div class="tile" onclick="openEditor('новини')">НОВИНИ</div>
        <div class="tile" onclick="openEditor('день народження')">ДНІ НАРОДЖЕННЯ</div>
        <div class="tile" onclick="openEditor('хвилина мовчання')">ХВИЛИНА МОВЧАННЯ</div>
        <div class="tile" style="background:#7f8c8d" onclick="alert('У розробці...')">ДОДАТИ ЩЕ</div>
    </div>

    <div id="editor" class="editor-box">
        <h3 id="editTitle">Новий слайд</h3>
        <input type="hidden" id="slideType">
        <textarea id="slideBody" rows="4" placeholder="Текст або посилання..."></textarea>
        <input id="slideBg" placeholder="Посилання на картинку фону (необов'язково)">
        <button onclick="saveSlide()">ЗБЕРЕГТИ НА ТАБЛО</button>
        <button class="btn-cancel" onclick="closeEditor()">СКАСУВАТИ</button>
    </div>

    <div id="queueList"><h3>Завантаження черги...</h3></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let currentEditId = null;

    function openEditor(type, body = '', bg = '', id = null) {
        currentEditId = id;
        document.getElementById('editor').style.display = 'block';
        document.getElementById('slideType').value = type;
        document.getElementById('slideBody').value = body;
        document.getElementById('slideBg').value = bg;
        document.getElementById('editTitle').innerText = (id ? 'Редагування: ' : 'Створити: ') + type.toUpperCase();
        window.scrollTo({ top: document.getElementById('editor').offsetTop - 20, behavior: 'smooth' });
    }

    function closeEditor() {
        document.getElementById('editor').style.display = 'none';
        currentEditId = null;
    }

    function saveSlide() {
        const data = {
            type: document.getElementById('slideType').value,
            body: document.getElementById('slideBody').value,
            bg: document.getElementById('slideBg').value
        };
        
        if (currentEditId) {
            db.child(currentEditId).update(data);
        } else {
            db.push(data);
        }
        closeEditor();
    }

    db.on('value', (snap) => {
        const list = document.getElementById('queueList');
        list.innerHTML = '<h3>Черга на екрані (можна редагувати):</h3>';
        snap.forEach(child => {
            const s = child.val();
            const id = child.key;
            list.innerHTML += `
                <div class="queue-item">
                    <span><b>${s.type.toUpperCase()}</b>: ${s.body.substring(0,30)}...</span>
                    <div class="actions">
                        <button class="edit" onclick="openEditor('${s.type}', '${s.body}', '${s.bg}', '${id}')">Редагувати</button>
                        <button class="del" onclick="if(confirm('Видалити?')) db.child('${id}').remove()">🗑</button>
                    </div>
                </div>`;
        });
    });
</script>
</body>
</html>
