<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмінка Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: grab; border-bottom: 5px solid #3498db; position: relative; }
        .card.type-Герой { border-bottom-color: #f1c40f; background: #fffdf2; }
        .preview { height: 100px; overflow: hidden; font-size: 0.8rem; color: #555; background: #f9f9f9; padding: 10px; border-radius: 6px; margin: 10px 0; }
        .btns { display: flex; gap: 8px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        #modal { display:none; position: fixed; top:50%; left:50%; transform:translate(-50%, -50%); background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 40px rgba(0,0,0,0.4); z-index: 1000; width: 450px; }
        input, textarea, select { width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

<div style="text-align: center; margin-bottom: 30px;">
    <button onclick="openEditor()" style="background: #27ae60; width: 250px;">+ ДОДАТИ СЛАЙД</button>
</div>

<div id="slideGrid" class="grid"></div>

<div id="modal">
    <h3>Редагування</h3>
    <select id="sType">
        <option value="новини">📰 Новини</option>
        <option value="Герой">🕯️ Герой (Меморіал)</option>
        <option value="карта">🌍 Карта</option>
        <option value="день народження">🎉 Свято</option>
    </select>
    <textarea id="sBody" rows="6" placeholder="Текст..."></textarea>
    <input id="sBg" placeholder="Посилання на картинку">
    <input type="hidden" id="sId">
    <button style="background:#27ae60;" onclick="save()">ЗБЕРЕГТИ</button>
    <button style="background:#95a5a6; margin-top:5px;" onclick="closeEditor()">СКАСУВАТИ</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    db.on('value', (snap) => {
        const grid = document.getElementById('slideGrid'); grid.innerHTML = '';
        const items = []; snap.forEach(c => items.push({id: c.key, ...c.val()}));
        items.sort((a,b) => (a.order || 0) - (b.order || 0));

        items.forEach(s => {
            const card = document.createElement('div');
            card.className = `card type-${s.type}`;
            card.dataset.id = s.id;
            card.innerHTML = `
                <div style="font-size: 0.7rem; font-weight: bold; opacity: 0.6;">${s.type.toUpperCase()}</div>
                <div class="preview">${s.body}</div>
                <div class="btns">
                    <button style="background:#3498db;" onclick="openEditor('${s.id}', '${s.type}', \`${s.body.replace(/`/g, '\\`')}\`, '${s.bg}')">⚙️</button>
                    <button style="background:#e74c3c;" onclick="del('${s.id}')">🗑</button>
                </div>
            `;
            grid.appendChild(card);
        });
    });

    new Sortable(document.getElementById('slideGrid'), {
        animation: 150, 
        onEnd: () => {
            document.querySelectorAll('.card').forEach((c, i) => db.child(c.dataset.id).update({order: i}));
        }
    });

    function openEditor(id='', type='новини', body='', bg='') {
        document.getElementById('sId').value = id;
        document.getElementById('sType').value = type;
        document.getElementById('sBody').value = body;
        document.getElementById('sBg').value = bg;
        document.getElementById('modal').style.display = 'block';
    }
    function closeEditor() { document.getElementById('modal').style.display = 'none'; }
    function save() {
        const id = document.getElementById('sId').value;
        const data = { type: document.getElementById('sType').value, body: document.getElementById('sBody').value, bg: document.getElementById('sBg').value };
        if(id) db.child(id).update(data); else db.push({...data, order: 999});
        closeEditor();
    }
    function del(id) { if(confirm('Видалити?')) db.child(id).remove(); }
</script>
</body>
</html>
