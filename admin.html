<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмінка ТБ - Редактор</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 15px; color: #1c1e21; }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; margin-top: 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        select, textarea, input, button { width: 100%; margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .btn-save { background: #28a745; }
        .btn-save:hover { background: #218838; }
        .btn-cancel { background: #6c757d; margin-top: -5px; }
        .item { background: #f8f9fa; padding: 12px; margin-top: 10px; border-radius: 8px; border-left: 5px solid #007bff; }
        .item-actions { display: flex; gap: 5px; margin-top: 10px; }
        .del { background: #dc3545; flex: 1; font-size: 14px; padding: 8px; }
        .edit { background: #ffc107; color: #212529; flex: 1; font-size: 14px; padding: 8px; }
        .editing-mode { border: 2px solid #28a745; background: #f0fff4; }
    </style>
</head>
<body>
<div class="card" id="mainCard">
    <h2 id="formTitle">📱 Пульт Табло</h2>
    
    <label>Тип контенту:</label>
    <select id="t">
        <option value="новини">Новини / Текст</option>
        <option value="карта">Карта тривог</option>
        <option value="хронометр">Хронометр війни</option>
    </select>
    
    <textarea id="b" rows="4" placeholder="Текст новини або посилання на карту..."></textarea>
    <input id="bg" placeholder="Фонова картинка (посилання)">
    
    <button id="actionBtn" onclick="save()">ОПУБЛІКУВАТИ</button>
    <button id="cancelBtn" class="btn-cancel" style="display:none;" onclick="cancelEdit()">Скасувати редагування</button>
    
    <div id="l">Завантаження черги...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let editId = null; // ID слайда, який ми редагуємо

    function save() {
        const type = document.getElementById('t').value;
        const body = document.getElementById('b').value;
        const bg = document.getElementById('bg').value;

        if (!body && type !== 'хронометр') return alert("Поле змісту пусте!");

        const data = { type, body, bg };

        if (editId) {
            // Оновлюємо існуючий слайд
            db.child(editId).update(data)
                .then(() => cancelEdit());
        } else {
            // Додаємо новий слайд
            db.push(data);
            clearForm();
        }
    }

    function startEdit(id, type, body, bg) {
        editId = id;
        document.getElementById('t').value = type;
        document.getElementById('b').value = body;
        document.getElementById('bg').value = bg || '';
        
        // Змінюємо вигляд форми
        document.getElementById('actionBtn').innerText = "ЗБЕРЕГТИ ЗМІНИ";
        document.getElementById('actionBtn').classList.add('btn-save');
        document.getElementById('cancelBtn').style.display = 'block';
        document.getElementById('formTitle').innerText = "📝 Редагування";
        document.getElementById('mainCard').classList.add('editing-mode');
        window.scrollTo(0, 0);
    }

    function cancelEdit() {
        editId = null;
        clearForm();
        document.getElementById('actionBtn').innerText = "ОПУБЛІКУВАТИ";
        document.getElementById('actionBtn').classList.remove('btn-save');
        document.getElementById('cancelBtn').style.display = 'none';
        document.getElementById('formTitle').innerText = "📱 Пульт Табло";
        document.getElementById('mainCard').classList.remove('editing-mode');
    }

    function clearForm() {
        document.getElementById('b').value = '';
        document.getElementById('bg').value = '';
    }

    db.on('value', (snap) => {
        const l = document.getElementById('l');
        l.innerHTML = '<h3 style="margin-top:20px;">Черга на екрані:</h3>';
        snap.forEach(c => {
            const s = c.val();
            // Створюємо безпечні рядки для передачі в функцію
            const safeBody = s.body.replace(/'/g, "\\'").replace(/\n/g, " ");
            const safeBg = (s.bg || "").replace(/'/g, "\\'");

            l.innerHTML += `
                <div class="item">
                    <div><b>${s.type.toUpperCase()}</b>: ${s.body.substring(0, 40)}...</div>
                    <div class="item-actions">
                        <button class="edit" onclick="startEdit('${c.key}', '${s.type}', '${safeBody}', '${safeBg}')">Редагувати</button>
                        <button class="del" onclick="del('${c.key}')">Видалити</button>
                    </div>
                </div>`;
        });
        if (!snap.exists()) l.innerHTML += '<p>Черга порожня</p>';
    });

    function del(id) { 
        if(confirm("Видалити цей слайд?")) db.child(id).remove(); 
    }
</script>
</body>
</html>
