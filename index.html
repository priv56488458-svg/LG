<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Pro - Memorial & Birthday Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; background-size: cover; background-position: center; }
        
        /* Розумний текст та колонки */
        .text { padding: 40px 80px; line-height: 1.4; max-width: 95%; word-wrap: break-word; text-shadow: 0 4px 12px #000; z-index: 10; transition: all 0.5s; font-weight: 600; }
        .columns { column-count: 2; column-gap: 60px; text-align: justify; }

        /* Стиль для Героїв (Хвилина мовчання) */
        .hero-info { background: rgba(0, 0, 0, 0.8); width: 100%; padding: 40px; box-sizing: border-box; border-top: 6px solid #f1c40f; position: absolute; bottom: 0; animation: slideUp 1s ease; }
        .hero-name { font-size: 3.5vw; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        .hero-desc { font-size: 1.8vw; line-height: 1.4; max-width: 85%; margin: 0 auto; }

        #clock { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; background: rgba(0,0,0,0.8); padding: 5px 25px; border-radius: 12px; z-index: 100; border: 1px solid #444; font-variant-numeric: tabular-nums; }
        iframe { width: 100vw; height: 100vh; border: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade { animation: fadeIn 1.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"></div>
    <audio id="mourningAudio">
        <source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg">
    </audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [];
    let heroSlides = [];
    let index = 0;
    let timer = null;
    let isMourning = false;

    // 1. ЗАВАНТАЖЕННЯ ДНІВ НАРОДЖЕННЯ (Стовпчик D)
    async function loadBirthdays() {
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const response = await fetch(csvUrl);
            const data = await response.text();
            const rows = data.split(/\r?\n/);
            const today = new Date().toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'});

            rows.forEach(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // Правильний спліт CSV
                if (cols.length >= 4) {
                    const dateVal = cols[0].replace(/"/g, '').trim();
                    const textVal = cols[3].replace(/"/g, '').trim();
                    if (dateVal === today && textVal) {
                        normalSlides.push({
                            type: 'день народження',
                            body: textVal,
                            bg: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=2070&auto=format&fit=crop'
                        });
                    }
                }
            });
        } catch (e) { console.error("Sheets Error:", e); }
    }

    // 2. СИНХРОНІЗАЦІЯ З FIREBASE
    db.on('value', async (snap) => {
        normalSlides = [];
        heroSlides = [];
        await loadBirthdays(); 
        snap.forEach(c => {
            const s = c.val();
            if (!s.paused) {
                if (s.type === 'Герой') heroSlides.push(s);
                else normalSlides.push(s);
            }
        });
        normalSlides.sort((a,b) => (a.order || 0) - (b.order || 0));
        if (!timer && !isMourning) show();
    });

    // 3. ОСНОВНИЙ ЦИКЛ ПОКАЗУ
    function show() {
        if (isMourning) return;
        clearTimeout(timer);
        const container = document.getElementById('display');
        if (normalSlides.length === 0) {
            container.innerHTML = "<h1>Оновлення даних...</h1>";
            timer = setTimeout(show, 5000);
            return;
        }

        const data = normalSlides[index % normalSlides.length];
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide fade';
        
        let duration = 15000;

        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}"></iframe>`;
            duration = 60000;
        } else {
            const len = data.body.length;
            let fontSize = "2.8vw";
            let cls = "";
            if (len > 700) { fontSize = "1.3vw"; cls = "columns"; duration = 45000; }
            else if (len > 300) { fontSize = "2.1vw"; duration = 25000; }

            if (data.bg) s.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(${data.bg})`;
            s.innerHTML = `<div class="text ${cls}" style="font-size:${fontSize}">${data.body.replace(/\n/g, '<br>')}</div>`;
        }
        
        container.appendChild(s);
        index++;
        timer = setTimeout(show, duration);
    }

    // 4. КОНТРОЛЬ ЧАСУ ТА ХВИЛИНА МОВЧАННЯ
    setInterval(() => {
        const now = new Date();
        const t = now.toTimeString().split(' ')[0];
        document.getElementById('clock').innerText = t;

        if (t === "08:59:35" && !isMourning) startMemorial();
    }, 1000);

    function startMemorial() {
        isMourning = true;
        clearTimeout(timer);
        const audio = document.getElementById('mourningAudio');
        audio.play().catch(() => alert("Натисніть на екран для активації звуку!"));

        const display = document.getElementById('display');
        const durationMs = 169000; // 2:49

        if (heroSlides.length === 0) {
            display.innerHTML = "<div class='slide' style='background:#000'><h1>Загальнонаціональна хвилина мовчання</h1></div>";
            setTimeout(() => { isMourning = false; show(); }, durationMs);
            return;
        }

        const timePerHero = durationMs / heroSlides.length;
        let hIdx = 0;

        function nextHero() {
            if (hIdx < heroSlides.length) {
                const h = heroSlides[hIdx];
                const lines = h.body.split('\n');
                display.innerHTML = `
                    <div class="slide fade" style="background-image: url(${h.bg}); justify-content: flex-end;">
                        <div class="hero-info">
                            <div class="hero-name">${lines[0]}</div>
                            <div class="hero-desc">${lines.slice(1).join('<br>')}</div>
                        </div>
                    </div>
                `;
                hIdx++;
                setTimeout(nextHero, timePerHero);
            } else { isMourning = false; show(); }
        }
        nextHero();
    }
    // Клік для дозволу звуку
    document.body.onclick = () => { console.log("Audio Enabled"); };
</script>
</body>
</html>
