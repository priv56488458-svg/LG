<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Pro Adaptive</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        /* НОВИЙ ЗМЕНШЕНИЙ ШРИФТ */
        .text { 
            font-size: 2.2vw; /* Було 3.5vw, тепер значно менше */
            font-weight: 600; 
            padding: 40px 100px; 
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
            z-index: 10; 
        }

        #clock { 
            position: absolute; top: 20px; right: 30px; 
            font-size: 2rem; background: rgba(0,0,0,0.8); 
            padding: 5px 20px; border-radius: 10px; 
            z-index: 100; border: 1px solid #444; 
        }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slides = [];
    let index = 0;
    let timer = null;

    db.on('value', (snap) => {
        slides = [];
        snap.forEach(c => { slides.push(c.val()); });
        index = 0;
        clearTimeout(timer);
        show();
    });

    function show() {
        const container = document.getElementById('display');
        if (slides.length === 0) {
            container.innerHTML = "<h1 style='margin-top:20vh'>Черга порожня</h1>";
            return;
        }

        const data = slides[index];
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide';

        let duration = 15000; 

        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}"></iframe>`;
            duration = 45000; 
        } else {
            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text">${data.body}</div>`;
        }

        container.appendChild(s);
        index = (index + 1) % slides.length;
        timer = setTimeout(show, duration);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
    }, 1000);
</script>
</body>
</html>
