<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board - Final Fix</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .slide { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        
        .text-wrap { 
            padding: 50px 100px; width: 95%; box-sizing: border-box; 
            text-shadow: 0 4px 25px rgba(0,0,0,1); font-weight: bold; 
            line-height: 1.2; white-space: pre-wrap; 
            background: rgba(0,0,0,0.4); border-radius: 30px;
        }

        #clock { position: absolute; top: 25px; right: 35px; font-size: 2.8rem; background: rgba(0,0,0,0.8); padding: 8px 30px; border-radius: 12px; z-index: 100; border: 1px solid #444; }
        .fade { animation: fadeIn 1.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"><h1>Завантаження даних...</h1></div>
    <audio id="mourningAudio"><source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg"></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [], heroSlides = [], currentIndex = 0, mainTimer = null, mourningActive = false;

    async function getBirthdayFromSheet() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url + "&t=" + Date.now());
            const csv = await res.text();
            
            const now = new Date();
            const searchDate = now.toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\s/g, '');
            
            // ПАРСЕР: Обробляємо CSV як єдиний масив, щоб не втратити рядки всередині клітинки
            if (csv.includes(searchDate)) {
                // Знаходимо індекс початку нашої дати
                let startIndex = csv.indexOf(searchDate);
                // Беремо великий шматок тексту від дати і далі
                let rawChunk = csv.substring(startIndex);
                
                // Знаходимо кінець блоку (наступна дата або кінець файлу)
                // Оскільки ваша дата формату XX.XX.202X, шукаємо наступний 2026 рік
                let nextEntry = rawChunk.indexOf('2026', 10); 
                let finalBlock = nextEntry !== -1 ? rawChunk.substring(0, nextEntry) : rawChunk;

                // Чистимо текст від технічного сміття
                let cleanText = finalBlock
                    .replace(searchDate, '')        // Видаляємо саму дату з тексту
                    .replace(/"/g, '')              // Видаляємо лапки
                    .replace(/,,+/g, '\n')          // Замінюємо пусті коми на переноси
                    .replace(/,/g, ' ')             // Поодинокі коми — на пробіли
                    .trim();
                
                return searchDate + "\n" + cleanText;
            }
            return null;
        } catch (e) { return null; }
    }

    db.on('value', async (snap) => {
        normalSlides = []; heroSlides = [];
        const todayText = await getBirthdayFromSheet();

        snap.forEach(c => {
            const s = c.val();
            const type = (s.type || "").toLowerCase().trim();
            if (type === 'герой') {
                heroSlides.push(s);
            } else if (type === 'день народження' || type === 'свято') {
                if (todayText) normalSlides.push({ ...s, body: todayText });
            } else if (!s.paused) {
                normalSlides.push(s);
            }
        });

        normalSlides.sort((a,b) => (a.order || 0) - (b.order || 0));
        if (normalSlides.length > 0 && !mainTimer && !mourningActive) nextSlide();
        else if (normalSlides.length === 0) document.getElementById('display').innerHTML = "<h1>Немає подій</h1>";
    });

    function nextSlide() {
        if (mourningActive) return;
        clearTimeout(mainTimer);
        const container = document.getElementById('display');
        if (normalSlides.length === 0) return;
        
        const data = normalSlides[currentIndex % normalSlides.length];
        container.innerHTML = '';
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        
        if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg})`;
        
        // Авто-розмір шрифту
        let fSize = data.body.length > 400 ? "2.2vw" : "3.2vw";
        slideEl.innerHTML = `<div class="text-wrap" style="font-size:${fSize}">${data.body}</div>`;
        
        container.appendChild(slideEl);
        currentIndex++;
        // Час показу: 15 сек або довше для великих текстів
        let wait = Math.max(15000, data.body.length * 40);
        mainTimer = setTimeout(nextSlide, wait);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);
</script>
</body>
</html>
