<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Pro - Memorial Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        
        /* Стиль для героїв */
        .hero-text { 
            background: rgba(0,0,0,0.7); 
            padding: 30px; 
            border-radius: 15px; 
            font-size: 2.2vw; 
            max-width: 80%; 
            line-height: 1.4;
            border-left: 8px solid #f1c40f;
        }

        #clock { position: absolute; top: 20px; right: 30px; font-size: 2rem; background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 10px; z-index: 100; border: 1px solid #444; }
        
        /* Анімація появи */
        .fade-in { animation: fadeIn 2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"></div>
    <audio id="mourningAudio" src="ПОСИЛАННЯ_НА_ВАШ_ФАЙЛ.mp3"></audio>

<script>
    // КОНФІГ FIREBASE (твій залишається без змін)
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let allSlides = [];
    let heroSlides = [];
    let normalSlides = [];
    let index = 0;
    let timer = null;
    let isMourningMode = false;

    db.on('value', (snap) => {
        heroSlides = [];
        normalSlides = [];
        snap.forEach(c => { 
            const s = c.val();
            if (!s.paused) {
                if (s.type === 'герой') heroSlides.push(s);
                else normalSlides.push(s);
            }
        });
        if(!timer && !isMourningMode) show();
    });

    function show() {
        if (isMourningMode) return;
        clearTimeout(timer);
        const container = document.getElementById('display');
        
        if (normalSlides.length === 0) {
            container.innerHTML = "<h1>Очікування...</h1>";
            timer = setTimeout(show, 5000);
            return;
        }

        const data = normalSlides[index % normalSlides.length];
        renderSlide(data);
        
        index++;
        timer = setTimeout(show, 15000);
    }

    function renderSlide(data) {
        const container = document.getElementById('display');
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide fade-in';
        
        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}" style="width:100%; height:100%; border:none;"></iframe>`;
        } else {
            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text" style="font-size:2.5vw">${data.body}</div>`;
        }
        container.appendChild(s);
    }

    // ГОЛОВНИЙ ТАЙМЕР ПЕРЕВІРКИ ЧАСУ
    setInterval(() => {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        const timeStr = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        document.getElementById('clock').innerText = timeStr;

        // ПЕРЕВІРКА НА 08:59:35
        if (timeStr === "08:59:35" && !isMourningMode) {
            startMourning();
        }
    }, 1000);

    function startMourning() {
        isMourningMode = true;
        clearTimeout(timer);
        const audio = document.getElementById('mourningAudio');
        audio.play().catch(e => console.log("Потрібна взаємодія з екраном для звуку"));

        const totalDuration = 169000; // 2 хв 49 сек в мілісекундах
        const timePerHero = heroSlides.length > 0 ? totalDuration / heroSlides.length : totalDuration;

        let heroIdx = 0;

        function nextHero() {
            if (heroIdx < heroSlides.length) {
                const data = heroSlides[heroIdx];
                const container = document.getElementById('display');
                container.innerHTML = `
                    <div class="slide fade-in" style="background: url(${data.bg}) center/cover">
                        <div class="hero-text">${data.body}</div>
                    </div>
                `;
                heroIdx++;
                setTimeout(nextHero, timePerHero);
            } else {
                // Кінець хвилини мовчання
                isMourningMode = false;
                show();
            }
        }

        if (heroSlides.length > 0) nextHero();
        else {
            document.getElementById('display').innerHTML = "<h1>Хвилина мовчання</h1>";
            setTimeout(() => { isMourningMode = false; show(); }, totalDuration);
        }
    }
</script>
</body>
</html>
