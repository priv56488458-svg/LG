<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board - Broadcast</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; }
        .slide { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; box-sizing: border-box; }
        .text-wrap { padding: 50px 100px; width: 100%; box-sizing: border-box; z-index: 10; text-shadow: 0 4px 15px rgba(0,0,0,0.9); font-weight: 600; line-height: 1.3; }
        .columns { column-count: 2; column-gap: 80px; text-align: justify; }
        .hero-overlay { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 40px; border-top: 8px solid #f1c40f; animation: slideUp 1s ease; }
        .hero-name { font-size: 3.5vw; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        #clock { position: absolute; top: 25px; right: 35px; font-size: 2.5rem; background: rgba(0,0,0,0.8); padding: 8px 30px; border-radius: 12px; z-index: 100; border: 1px solid #444; font-variant-numeric: tabular-nums; }
        iframe { width: 100vw; height: 100vh; border: none; background: white; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade { animation: fadeIn 1.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"></div>
    <audio id="mourningAudio"><source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg"></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [], heroSlides = [], currentIndex = 0, mainTimer = null, mourningActive = false;

    async function getBirthdayFromSheet() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url + "&t=" + Date.now());
            const csv = await res.text();
            const rows = csv.split(/\r?\n/);
            const today = new Date().toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'});
            let activeText = null;
            rows.forEach(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length >= 4 && cols[0].replace(/"/g, '').trim() === today) {
                    activeText = cols[3].replace(/"/g, '').trim();
                }
            });
            return activeText;
        } catch (e) { return null; }
    }

    db.on('value', async (snap) => {
    console.log("Firebase: отримано дані"); // Для перевірки в консолі (F12)
    normalSlides = [];
    heroSlides = [];
    
    // 1. Отримуємо текст з таблиці (якщо є на сьогодні)
    const todayGreeting = await getBirthdayFromSheet();
    if (todayGreeting) console.log("Таблиця: знайдено привітання!");

    // 2. Перебираємо всі слайди з бази
    snap.forEach(c => {
        const s = c.val();
        if (!s) return;

        // Приводимо тип до нижнього регістру, щоб уникнути помилок з великими літерами
        const type = (s.type || "").toLowerCase().trim();

        if (type === 'герой') {
            heroSlides.push(s);
        } 
        else if (type === 'день народження' || type === 'свято') {
            // Додаємо слайд ДН, ТІЛЬКИ якщо в таблиці є текст на сьогодні
            if (todayGreeting) {
                normalSlides.push({ ...s, body: todayGreeting });
            } else {
                console.log("Слайд ДН пропущено: в таблиці немає дати на сьогодні");
            }
        } 
        else if (!s.paused) {
            // Всі інші типи (новини, карта тощо)
            normalSlides.push(s);
        }
    });

    // Сортуємо за порядком
    normalSlides.sort((a, b) => (a.order || 0) - (b.order || 0));

    console.log("Всього слайдів до показу:", normalSlides.length);

    // Запускаємо показ, якщо черга не пуста і показ ще не йде
    if (normalSlides.length > 0) {
        if (!mainTimer && !mourningActive) nextSlide();
    } else {
        document.getElementById('display').innerHTML = "<h1>Немає активних слайдів. Додайте новини в адмінці.</h1>";
    }
});

    function nextSlide() {
        if (mourningActive) return;
        const container = document.getElementById('display');
        if (normalSlides.length === 0) { container.innerHTML = "<h1>Очікування даних...</h1>"; mainTimer = setTimeout(nextSlide, 5000); return; }
        
        const data = normalSlides[currentIndex % normalSlides.length];
        container.innerHTML = '';
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        let time = 15000;

        if (data.type === 'карта' || data.type === 'таблиця') {
            slideEl.innerHTML = `<iframe src="${data.body}"></iframe>`;
            time = 45000;
        } else {
            const isLong = data.body.length > 600;
            if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg})`;
            slideEl.innerHTML = `<div class="text-wrap ${isLong ? 'columns' : ''}" style="font-size: ${isLong ? '1.5vw' : '2.8vw'}">${data.body.replace(/\n/g, '<br>')}</div>`;
            if (isLong) time = 35000;
        }
        container.appendChild(slideEl);
        currentIndex++;
        mainTimer = setTimeout(nextSlide, time);
    }

    setInterval(() => {
        const t = new Date().toTimeString().split(' ')[0];
        document.getElementById('clock').innerText = t;
        if (t === "08:59:35" && !mourningActive) runMourning();
    }, 1000);

    function runMourning() {
        mourningActive = true; clearTimeout(mainTimer);
        const audio = document.getElementById('mourningAudio');
        audio.play().catch(() => {});
        const display = document.getElementById('display');
        const duration = 169000;
        if (heroSlides.length === 0) {
            display.innerHTML = "<div class='slide'><h1>Хвилина мовчання</h1></div>";
            setTimeout(() => { mourningActive = false; nextSlide(); }, duration);
            return;
        }
        const heroTime = duration / heroSlides.length;
        let hIdx = 0;
        function showHero() {
            if (hIdx < heroSlides.length) {
                const h = heroSlides[hIdx];
                display.innerHTML = `<div class="slide fade" style="background-image: url(${h.bg}); justify-content: flex-end;"><div class="hero-overlay"><div class="hero-name">${h.body.split('\n')[0]}</div><div class="hero-story">${h.body.split('\n').slice(1).join('<br>')}</div></div></div>`;
                hIdx++; setTimeout(showHero, heroTime);
            } else { mourningActive = false; nextSlide(); }
        }
        showHero();
    }
    document.body.onclick = () => console.log("Audio Enabled");
</script>
</body>
</html>
