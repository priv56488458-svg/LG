<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        .text { font-size: 5rem; font-weight: bold; padding: 40px; text-shadow: 2px 2px 10px #000; z-index: 10; }
        #clock { position: absolute; top: 10px; right: 20px; font-size: 2.5rem; background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 10px; z-index: 100; border: 1px solid #444; }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slides = [];
    let index = 0;
    let timer = null;

    // Слухаємо базу: при будь-якій зміні скидаємо цикл на початок
    db.on('value', (snap) => {
        console.log("Дані оновлено");
        slides = [];
        snap.forEach(c => { slides.push(c.val()); });
        
        index = 0; // Починаємо з першого слайда
        clearTimeout(timer); // Вбиваємо старий таймер
        show(); // Запускаємо показ
    });

    function show() {
        const container = document.getElementById('display');
        if (slides.length === 0) {
            container.innerHTML = "<h1 style='padding-top:20%'>Черга порожня. Додайте слайди!</h1>";
            return;
        }

        const data = slides[index];
        container.innerHTML = ''; // Повне очищення екрана
        
        const s = document.createElement('div');
        s.className = 'slide';

        let duration = 15000; // 15 секунд для тексту

        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}"></iframe>`;
            duration = 45000; // 45 секунд для карти
        } else {
            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text">${data.body}</div>`;
        }

        container.appendChild(s);

        // Наступний слайд через заданий час
        index = (index + 1) % slides.length;
        timer = setTimeout(show, duration);
    }

    // Годинник
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
    }, 1000);
</script>
</body>
</html>
