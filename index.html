<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board - Live</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #display { width: 100vw; height: 100vh; position: relative; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; }
        .text-wrap { 
            padding: 40px 80px; width: 90%; max-height: 85vh; overflow: hidden;
            text-shadow: 0 4px 15px rgba(0,0,0,0.9); font-weight: bold; line-height: 1.2;
            white-space: pre-wrap; word-wrap: break-word; font-size: 2.5vw;
        }
        #clock { position: absolute; top: 20px; right: 20px; font-size: 2rem; background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 10px; z-index: 100; border: 1px solid #555; }
        iframe { width: 100vw; height: 100vh; border: none; }
        .fade { animation: fadeIn 1.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"><h1>Завантаження системи...</h1></div>
    <audio id="mourningAudio"><source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg"></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [], heroSlides = [], currentIndex = 0, mainTimer = null, mourningActive = false;

    // ГНУЧКИЙ ПОШУК ДАТИ
    async function getBirthdayFromSheet() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url + "&nocache=" + Date.now());
            const csv = await res.text();
            const rows = csv.split(/\r?\n/);
            
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            const todayStr = `${d}.${m}.${y}`; // "29.01.2026"

            let result = null;
            rows.forEach(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (cols.length >= 4) {
                    const dateCell = cols[0].replace(/"/g, '').trim();
                    const textCell = cols[3].replace(/"/g, '').trim();
                    // Шукаємо входження дати (на випадок зайвих символів у клітинці)
                    if (dateCell.includes(todayStr) && textCell) {
                        result = textCell;
                    }
                }
            });
            return result;
        } catch (e) { return null; }
    }

    db.on('value', async (snap) => {
        normalSlides = []; heroSlides = [];
        const todayText = await getBirthdayFromSheet();

        snap.forEach(c => {
            const s = c.val();
            const type = (s.type || "").toLowerCase();
            if (type === 'герой') heroSlides.push(s);
            else if (type === 'день народження' || type === 'свято') {
                if (todayText) normalSlides.push({ ...s, body: todayText });
            } else if (!s.paused) normalSlides.push(s);
        });

        normalSlides.sort((a,b) => (a.order || 0) - (b.order || 0));
        
        if (normalSlides.length > 0) {
            if (!mainTimer && !mourningActive) nextSlide();
        } else {
            document.getElementById('display').innerHTML = "<h1>Чекаємо на слайди...</h1>";
        }
    });

    function nextSlide() {
        if (mourningActive) return;
        const container = document.getElementById('display');
        const data = normalSlides[currentIndex % normalSlides.length];
        container.innerHTML = '';
        
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        let time = 15000;

        if (data.type === 'карта') {
            slideEl.innerHTML = `<iframe src="${data.body}"></iframe>`;
            time = 60000;
        } else {
            if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url(${data.bg})`;
            
            // Якщо текст дуже довгий, зменшуємо шрифт
            const fontSize = data.body.length > 400 ? '1.8vw' : '2.8vw';
            slideEl.innerHTML = `<div class="text-wrap" style="font-size: ${fontSize}">${data.body.replace(/\n/g, '<br>')}</div>`;
            time = data.body.length > 400 ? 30000 : 15000;
        }

        container.appendChild(slideEl);
        currentIndex++;
        mainTimer = setTimeout(nextSlide, time);
    }

    setInterval(() => {
        const t = new Date().toTimeString().split(' ')[0];
        document.getElementById('clock').innerText = t;
        if (t === "08:59:35" && !mourningActive) runMourning();
    }, 1000);

    function runMourning() {
        mourningActive = true; clearTimeout(mainTimer);
        const audio = document.getElementById('mourningAudio');
        audio.play().catch(() => {});
        const display = document.getElementById('display');
        const duration = 169000;
        
        if (heroSlides.length === 0) {
            display.innerHTML = "<div class='slide'><h1>Герої не вмирають!</h1></div>";
            setTimeout(() => { mourningActive = false; nextSlide(); }, duration);
            return;
        }

        const heroTime = duration / heroSlides.length;
        let hIdx = 0;
        function showHero() {
            if (hIdx < heroSlides.length) {
                const h = heroSlides[hIdx];
                const parts = h.body.split('\n');
                display.innerHTML = `<div class="slide fade" style="background-image: url(${h.bg}); justify-content: flex-end;"><div class="hero-overlay"><div class="hero-name">${parts[0]}</div><div class="hero-story">${parts.slice(1).join('<br>')}</div></div></div>`;
                hIdx++; setTimeout(showHero, heroTime);
            } else { mourningActive = false; nextSlide(); }
        }
        showHero();
    }
</script>
</body>
</html>
