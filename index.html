<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Smart Adaptive</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        /* Базовий стиль тексту */
        .text { 
            font-weight: 600; 
            padding: 20px 60px; 
            line-height: 1.4;
            max-width: 95%;
            word-wrap: break-word;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Стиль для ДУЖЕ довгих текстів (колонки) */
        .long-text {
            column-count: 2;
            column-gap: 50px;
            text-align: justify;
            font-weight: 500;
        }

        #clock { 
            position: absolute; top: 20px; right: 30px; 
            font-size: 2rem; background: rgba(0,0,0,0.8); 
            padding: 5px 20px; border-radius: 10px; 
            z-index: 100; border: 1px solid #444; 
        }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slides = [];
    let index = 0;
    let timer = null;

    db.on('value', (snap) => {
        const newSlides = [];
        snap.forEach(c => { 
            const s = c.val();
            if (!s.paused) newSlides.push({ ...s, id: c.key }); 
        });
        newSlides.sort((a, b) => (a.order || 0) - (b.order || 0));
        slides = newSlides;
        if (!timer) show();
    });

    function show() {
        clearTimeout(timer);
        const container = document.getElementById('display');
        
        // 1. Хвилина мовчання
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        if (currentTime === "09:00") {
            displayMourning();
            timer = setTimeout(show, 30000);
            return;
        }

        if (slides.length === 0) {
            container.innerHTML = "<h1>Очікування слайдів...</h1>";
            timer = setTimeout(show, 5000);
            return;
        }

        const data = slides[index];
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide';

        let duration = 20000; // Збільшив до 20 сек для довгих текстів

        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}"></iframe>`;
            duration = 60000;
        } 
        else if (data.type === 'день народження') {
            s.style.background = "linear-gradient(45deg, #ff00cc, #3333ff)";
            s.innerHTML = `<div style="font-size: 5vw;">🎉</div><div class="text" style="font-size: 3vw;">${data.body}</div><div style="font-size: 5vw;">🎂</div>`;
        } 
        else {
            // РОЗУМНЕ КЕРУВАННЯ ТЕКСТОМ
            const textLen = data.body.length;
            let fontSize = "2.8vw";
            let extraClass = "";

            if (textLen > 1000) {
                fontSize = "1.2vw"; // Маленький шрифт для "статей"
                extraClass = "long-text";
                duration = 45000; // Даємо більше часу прочитати
            } else if (textLen > 500) {
                fontSize = "1.6vw";
                duration = 30000;
            } else if (textLen > 200) {
                fontSize = "2.2vw";
            }

            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text ${extraClass}" style="font-size: ${fontSize}">${data.body}</div>`;
        }

        container.appendChild(s);
        index = (index + 1) % slides.length;
        timer = setTimeout(show, duration);
    }

    function displayMourning() {
        const container = document.getElementById('display');
        container.innerHTML = `<div class="slide" style="background: #000;"><div style="font-size: 10vw;">🕯️</div><div style="font-size: 4vw; font-weight: bold; text-transform: uppercase;">Загальнонаціональна хвилина мовчання</div></div>`;
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
    }, 1000);
</script>
</body>
</html>
