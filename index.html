<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Professional</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; }
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        /* Адаптивний шрифт */
        .text { 
            font-size: 2.8vw; 
            font-weight: 600; 
            padding: 40px 100px; 
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
            z-index: 10; 
        }

        #clock { 
            position: absolute; top: 20px; right: 30px; 
            font-size: 2rem; background: rgba(0,0,0,0.8); 
            padding: 5px 20px; border-radius: 10px; 
            z-index: 100; border: 1px solid #444; 
        }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slides = [];
    let index = 0;
    let timer = null;

    // Слухаємо базу даних
    db.on('value', (snap) => {
        const newSlides = [];
        snap.forEach(c => { 
            const s = c.val();
            if (!s.paused) newSlides.push({ ...s, id: c.key }); 
        });
        
        // Сортування за чергою, яку ти виставив в адмінці
        newSlides.sort((a, b) => (a.order || 0) - (b.order || 0));
        
        slides = newSlides;
        
        // Якщо це перше завантаження або черга була порожня - запускаємо
        if (!timer) show();
    });

    function show() {
        clearTimeout(timer);
        const container = document.getElementById('display');
        
        // 1. Перевірка на Хвилину мовчання
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

        if (currentTime === "09:00") {
            displayMourning();
            timer = setTimeout(show, 30000); // Перевірити знову через 30 сек
            return;
        }

        // 2. Якщо слайдів немає
        if (slides.length === 0) {
            container.innerHTML = "<h1>Очікування нових слайдів...</h1>";
            timer = setTimeout(show, 5000);
            return;
        }

        // 3. Відображення слайда
        const data = slides[index];
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide';

        let duration = 15000; // Стандарт 15 сек

        if (data.type === 'карта') {
            s.innerHTML = `<iframe src="${data.body}"></iframe>`;
            duration = 60000; // Карта на 1 хв
        } 
        else if (data.type === 'день народження') {
            s.style.background = "linear-gradient(45deg, #ff00cc, #3333ff)";
            s.innerHTML = `
                <div style="font-size: 5vw;">🎉</div>
                <div class="text" style="color: #fff; text-transform: uppercase;">${data.body}</div>
                <div style="font-size: 5vw;">🎂</div>
            `;
            duration = 20000;
        } 
        else {
            // Звичайні новини
            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text">${data.body}</div>`;
        }

        container.appendChild(s);

        // Перехід до наступного
        index = (index + 1) % slides.length;
        timer = setTimeout(show, duration);
    }

    function displayMourning() {
        const container = document.getElementById('display');
        container.innerHTML = `
            <div class="slide" style="background: #000; color: white;">
                <div style="font-size: 10vw;">🕯️</div>
                <div style="font-size: 4vw; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; padding: 20px;">Загальнонаціональна хвилина мовчання</div>
                <div style="font-size: 2vw; opacity: 0.8;">Вшановуємо пам'ять героїв</div>
            </div>
        `;
    }

    // Годинник
    setInterval(() => {
        const timeStr = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
        document.getElementById('clock').innerText = timeStr;
    }, 1000);
</script>
</body>
</html>
