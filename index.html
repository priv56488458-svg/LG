<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Інформаційне табло</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; }
        
        .slide { 
            width: 100vw; height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            background-size: cover; background-position: center; box-sizing: border-box;
        }
        
        /* Текст та колонки */
        .text-wrap { padding: 50px 100px; width: 100%; box-sizing: border-box; z-index: 10; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .columns { column-count: 2; column-gap: 80px; text-align: justify; }

        /* Меморіал (Герої) */
        .hero-overlay { 
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); 
            padding: 40px; border-top: 8px solid #f1c40f; animation: slideUp 1s ease;
        }
        .hero-name { font-size: 3.5vw; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        .hero-story { font-size: 1.8vw; line-height: 1.4; opacity: 0.9; }

        #clock { 
            position: absolute; top: 25px; right: 35px; font-size: 2.5rem; 
            background: rgba(0,0,0,0.8); padding: 8px 30px; border-radius: 12px; 
            z-index: 100; border: 1px solid #444; font-variant-numeric: tabular-nums;
        }
        iframe { width: 100vw; height: 100vh; border: none; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .fade { animation: fadeIn 1.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"></div>
    <audio id="mourningAudio">
        <source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg">
    </audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [];
    let heroSlides = [];
    let currentIndex = 0;
    let mainTimer = null;
    let mourningActive = false;

    // ЗАВАНТАЖЕННЯ ТАБЛИЦІ (Стовпець D)
    async function fetchBirthdays() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url);
            const csv = await res.text();
            const rows = csv.split(/\r?\n/);
            const today = new Date().toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'});

            rows.forEach(row => {
                const parts = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (parts.length >= 4) {
                    const dateCell = parts[0].replace(/"/g, '').trim();
                    const textCell = parts[3].replace(/"/g, '').trim();
                    if (dateCell === today && textCell) {
                        normalSlides.push({
                            type: 'день народження',
                            body: textCell,
                            bg: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?q=80&w=2070&auto=format&fit=crop'
                        });
                    }
                }
            });
        } catch (e) { console.error("Sheets error", e); }
    }

    db.on('value', async (snap) => {
        normalSlides = [];
        heroSlides = [];
        await fetchBirthdays();
        snap.forEach(c => {
            const s = c.val();
            if (s.type === 'Герой') heroSlides.push(s);
            else normalSlides.push(s);
        });
        normalSlides.sort((a,b) => (a.order || 0) - (b.order || 0));
        if (!mainTimer && !mourningActive) nextSlide();
    });

    function nextSlide() {
        if (mourningActive) return;
        const container = document.getElementById('display');
        if (normalSlides.length === 0) {
            container.innerHTML = "<h1>Оновлення даних...</h1>";
            mainTimer = setTimeout(nextSlide, 5000);
            return;
        }

        const data = normalSlides[currentIndex % normalSlides.length];
        container.innerHTML = '';
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        
        let time = 15000;

        if (data.type === 'карта') {
            slideEl.innerHTML = `<iframe src="${data.body}"></iframe>`;
            time = 60000;
        } else {
            const isLong = data.body.length > 700;
            if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg})`;
            slideEl.innerHTML = `
                <div class="text-wrap ${isLong ? 'columns' : ''}" style="font-size: ${isLong ? '1.4vw' : '2.8vw'}">
                    ${data.body.replace(/\n/g, '<br>')}
                </div>`;
            if (isLong) time = 40000;
        }

        container.appendChild(slideEl);
        currentIndex++;
        mainTimer = setTimeout(nextSlide, time);
    }

    // ГОДИННИК ТА ПЕРЕВІРКА 08:59:35
    setInterval(() => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];
        document.getElementById('clock').innerText = timeStr;
        if (timeStr === "08:59:35" && !mourningActive) runMourning();
    }, 1000);

    function runMourning() {
        mourningActive = true;
        clearTimeout(mainTimer);
        const audio = document.getElementById('mourningAudio');
        audio.play().catch(() => console.log("Взаємодійте з екраном для звуку"));

        const display = document.getElementById('display');
        const duration = 169000; // 2:49
        
        if (heroSlides.length === 0) {
            display.innerHTML = "<div class='slide'><h1>Загальнонаціональна хвилина мовчання</h1></div>";
            setTimeout(() => { mourningActive = false; nextSlide(); }, duration);
            return;
        }

        const heroTime = duration / heroSlides.length;
        let hIdx = 0;

        function showHero() {
            if (hIdx < heroSlides.length) {
                const h = heroSlides[hIdx];
                const lines = h.body.split('\n');
                display.innerHTML = `
                    <div class="slide fade" style="background-image: url(${h.bg}); justify-content: flex-end;">
                        <div class="hero-overlay">
                            <div class="hero-name">${lines[0]}</div>
                            <div class="hero-story">${lines.slice(1).join('<br>')}</div>
                        </div>
                    </div>`;
                hIdx++;
                setTimeout(showHero, heroTime);
            } else { mourningActive = false; nextSlide(); }
        }
        showHero();
    }
</script>
</body>
</html>
