<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board - Final Reconstruction</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .text-wrap { 
            padding: 40px 60px; width: 92%; box-sizing: border-box; 
            text-shadow: 0 5px 35px #000; font-weight: 800; 
            line-height: 1.3; white-space: pre-wrap; 
            background: rgba(0,0,0,0.5); border-radius: 40px;
        }
        #clock { position: absolute; top: 25px; right: 35px; font-size: 3rem; background: rgba(0,0,0,0.8); padding: 10px 40px; border-radius: 15px; border: 2px solid #555; }
        .fade { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"><h1>Оновлення...</h1></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    async function getBirthdayFromSheet() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url + "&t=" + Date.now());
            const text = await res.text();
            const today = new Date().toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\s/g, '');
            
            // Нова логіка: шукаємо рядок з датою і збираємо ВСЕ до наступної дати або кінця
            const parts = text.split('\n');
            let found = false;
            let collectedText = [];

            for (let line of parts) {
                if (line.includes(today)) {
                    found = true;
                    collectedText.push(line.replace(today, '').replace(/^"|,|"/g, '').trim());
                    continue;
                }
                // Якщо ми вже знайшли сьогоднішню дату, але зустріли іншу дату — зупиняємось
                if (found && /\d{2}\.\d{2}\.\d{4}/.test(line)) break;
                // Якщо ми в процесі збору — додаємо рядок
                if (found) collectedText.push(line.replace(/^"|"$/g, '').trim());
            }

            if (collectedText.length > 0) {
                let fullBody = collectedText.join('\n').replace(/""/g, '"').trim();
                // Примусово розбиваємо по званнях, якщо вони злилися
                return today + "\n" + fullBody.replace(/(солдат|сержант|лейтенант|майстер-сержант|полковник|майор|капітан)/gi, '\n$1');
            }
            return null;
        } catch (e) { return null; }
    }

    let normalSlides = [], currentIndex = 0, mainTimer = null;

    db.on('value', async (snap) => {
        normalSlides = [];
        const todayText = await getBirthdayFromSheet();
        snap.forEach(c => {
            const s = c.val();
            if ((s.type === 'день народження' || s.type === 'свято') && todayText) {
                normalSlides.push({ ...s, body: todayText });
            } else if (!s.paused) {
                normalSlides.push(s);
            }
        });
        if (normalSlides.length > 0 && !mainTimer) nextSlide();
    });

    function nextSlide() {
        clearTimeout(mainTimer);
        const container = document.getElementById('display');
        const data = normalSlides[currentIndex % normalSlides.length];
        
        container.innerHTML = '';
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg})`;
        slideEl.style.backgroundSize = "cover";
        
        let fSize = data.body.length > 300 ? "2.2vw" : "3.1vw";
        slideEl.innerHTML = `<div class="text-wrap" style="font-size:${fSize}">${data.body}</div>`;
        
        container.appendChild(slideEl);
        currentIndex++;
        mainTimer = setTimeout(nextSlide, 15000);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);
</script>
</body>
</html>
