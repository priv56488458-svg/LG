<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board - Absolute Fix</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background-size: cover; background-position: center; }
        
        .text-wrap { 
            padding: 40px 60px; width: 92%; box-sizing: border-box; 
            text-shadow: 0 5px 35px rgba(0,0,0,1); font-weight: 800; 
            line-height: 1.3; white-space: pre-wrap; 
            background: rgba(0,0,0,0.45); border-radius: 40px;
        }

        #clock { position: absolute; top: 25px; right: 35px; font-size: 3rem; background: rgba(0,0,0,0.85); padding: 10px 40px; border-radius: 15px; z-index: 100; border: 2px solid #555; font-variant-numeric: tabular-nums; }
        .fade { animation: fadeIn 1.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="clock">00:00:00</div>
    <div id="display"><h1>Синхронізація...</h1></div>
    <audio id="mourningAudio"><source src="https://docs.google.com/uc?export=download&id=1yHGjnCUZZVrSAPy2pAs79zoM0ViJoaAe" type="audio/mpeg"></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let normalSlides = [], heroSlides = [], currentIndex = 0, mainTimer = null, mourningActive = false;

    async function getBirthdayFromSheet() {
        const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqeNuXUW-LcH981pbZC5Qj9qLbbXRLtUkxUtPgpwmsP94tiP3kRwRmW8Rp90Og8o24r_iQF0dl8IhG/pub?output=csv";
        try {
            const res = await fetch(url + "&t=" + Date.now());
            const csvText = await res.text();
            
            const now = new Date();
            const today = now.toLocaleDateString('uk-UA', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\s/g, '');
            
            if (csvText.includes(today)) {
                // Вирізаємо частину тексту після дати
                let parts = csvText.split(today);
                let rawData = parts[1].split('2026')[0]; // беремо до наступного запису

                // ПРАВИЛЬНЕ ВІДНОВЛЕННЯ ТЕКСТУ З ФОРМУЛИ:
                let clean = rawData
                    .replace(/^"/, '')        // прибрати лапку на початку
                    .replace(/"$/, '')        // прибрати лапку в кінці
                    .replace(/""/g, '"')      // виправити подвійні лапки
                    .replace(/,,/g, '\n')     // ЗАМІНА: подвійна кома в CSV = ваш перенос рядка
                    .trim();

                // Додаткове форматування, якщо CSV злило все в один рядок
                let final = clean
                    .replace("Вітаємо з", "\nВітаємо з\n")
                    .replace("Свій день народження відзначають:", "\n\nСвій день народження відзначають:\n")
                    .replace("Разом до Перемоги!", "\n\nРазом до Перемоги!")
                    .replace(/(майстер|солдат|сержант|лейтенант|полковник|майор|капітан)/gi, '\n$1');

                return today + "\n" + final.replace(/\n{3,}/g, '\n\n'); // прибираємо зайві порожні рядки
            }
            return null;
        } catch (e) { return null; }
    }

    db.on('value', async (snap) => {
        normalSlides = []; heroSlides = [];
        const todayContent = await getBirthdayFromSheet();

        snap.forEach(c => {
            const s = c.val();
            const type = (s.type || "").toLowerCase().trim();
            if (type === 'герой') {
                heroSlides.push(s);
            } else if (type === 'день народження' || type === 'свято') {
                if (todayContent) normalSlides.push({ ...s, body: todayContent });
            } else if (!s.paused) {
                normalSlides.push(s);
            }
        });

        normalSlides.sort((a,b) => (a.order || 0) - (b.order || 0));
        if (normalSlides.length > 0 && !mainTimer && !mourningActive) nextSlide();
    });

    function nextSlide() {
        if (mourningActive) return;
        clearTimeout(mainTimer);
        const container = document.getElementById('display');
        if (normalSlides.length === 0) return;
        
        const data = normalSlides[currentIndex % normalSlides.length];
        container.innerHTML = '';
        const slideEl = document.createElement('div');
        slideEl.className = 'slide fade';
        
        if (data.bg) slideEl.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url(${data.bg})`;
        
        let fSize = data.body.length > 300 ? "2.4vw" : "3.2vw";
        slideEl.innerHTML = `<div class="text-wrap" style="font-size:${fSize}">${data.body}</div>`;
        
        container.appendChild(slideEl);
        currentIndex++;
        let wait = Math.max(15000, data.body.length * 50);
        mainTimer = setTimeout(nextSlide, wait);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toTimeString().split(' ')[0];
    }, 1000);
</script>
</body>
</html>
