<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Smart TV Board</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #000; }
        .active { display: flex; }
        iframe { width: 100%; height: 100%; border: none; }
        .text-content { padding: 50px; font-size: 4.5rem; font-weight: 800; line-height: 1.2; text-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 10; }
        #clock { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 15px; z-index: 100; font-weight: bold; border: 1px solid #333; }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slidesData = [];
    let currentIndex = 0;
    let mainTimer;

    // Слідкуємо за базою даних
    db.on('value', (snap) => {
        const data = [];
        snap.forEach(child => { data.push(child.val()); });
        slidesData = data;
        if (slidesData.length > 0 && !mainTimer) {
            startDisplay();
        }
    });

    function startDisplay() {
        if (slidesData.length === 0) {
            document.getElementById('display').innerHTML = "<h1>Очікування слайдів...</h1>";
            return;
        }

        const container = document.getElementById('display');
        const currentSlide = slidesData[currentIndex];
        
        container.innerHTML = ''; // Очищуємо
        const slideDiv = document.createElement('div');
        slideDiv.className = 'slide active';

        let displayTime = 15000; // Стандарт: 15 сек

        if (currentSlide.type === 'карта') {
            slideDiv.innerHTML = `<iframe src="${currentSlide.body}"></iframe>`;
            displayTime = 60000; // Карта на 1 хвилину
        } else {
            if (currentSlide.bg) {
                slideDiv.style.background = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${currentSlide.bg}') center/cover`;
            }
            slideDiv.innerHTML = `<div class="text-content">${currentSlide.body}</div>`;
        }

        container.appendChild(slideDiv);

        // Плануємо наступний слайд
        currentIndex = (currentIndex + 1) % slidesData.length;
        mainTimer = setTimeout(startDisplay, displayTime);
    }

    // Годинник
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute: '2-digit'});
    }, 1000);
</script>
</body>
</html>
