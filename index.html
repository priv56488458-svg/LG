<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TV Board Pro Adaptive</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
        #display { width: 100%; height: 100%; position: relative; }
        
        .slide { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-sizing: border-box; }
        
        /* КАРТА НА ВЕСЬ ЕКРАН */
        .map-frame { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1; }

        /* ТЕКСТ ТА КОЛОНКИ */
        .text { 
            font-weight: 600; 
            padding: 20px 80px; 
            line-height: 1.45;
            max-width: 95%;
            word-wrap: break-word;
            text-shadow: 0 4px 12px rgba(0,0,0,1);
            z-index: 10;
            transition: all 0.5s;
        }

        .columns {
            column-count: 2;
            column-gap: 70px;
            text-align: justify;
        }

        #clock { 
            position: absolute; top: 20px; right: 30px; 
            font-size: 2.2rem; background: rgba(0,0,0,0.85); 
            padding: 5px 25px; border-radius: 12px; 
            z-index: 100; border: 1px solid #444; 
        }
    </style>
</head>
<body>
    <div id="clock">00:00</div>
    <div id="display"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI5emOGELK-Ac4lCn_7nIoT-okhEQgVfY",
        authDomain: "myboard-42e97.firebaseapp.com",
        databaseURL: "https://myboard-42e97-default-rtdb.firebaseio.com",
        projectId: "myboard-42e97",
        storageBucket: "myboard-42e97.firebasestorage.app",
        messagingSenderId: "819814141254",
        appId: "1:819814141254:web:abcfad133a915762ae6947"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('slides');

    let slides = [];
    let index = 0;
    let timer = null;

    db.on('value', (snap) => {
        const list = [];
        snap.forEach(c => { if(!c.val().paused) list.push(c.val()); });
        list.sort((a, b) => (a.order || 0) - (b.order || 0));
        slides = list;
        if(!timer) show();
    });

    function show() {
        clearTimeout(timer);
        const container = document.getElementById('display');
        
        // 1. ХВИЛИНА МОВЧАННЯ (09:00)
        const now = new Date();
        const time = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
        if (time === "09:00") {
            container.innerHTML = `<div class="slide" style="background:#000"><div style="font-size:12vw">🕯️</div><div style="font-size:4.5vw; font-weight:bold; text-transform:uppercase; letter-spacing:4px;">Загальнонаціональна хвилина мовчання</div></div>`;
            timer = setTimeout(show, 30000);
            return;
        }

        if (slides.length === 0) {
            container.innerHTML = "<h1 style='text-align:center; padding-top:20%'>Очікування контенту...</h1>";
            timer = setTimeout(show, 5000);
            return;
        }

        const data = slides[index];
        container.innerHTML = '';
        const s = document.createElement('div');
        s.className = 'slide';

        let duration = 15000;

        if (data.type === 'карта') {
            // ФІКС КАРТИ: Прибираємо flex і ставимо iframe на весь екран
            s.innerHTML = `<iframe class="map-frame" src="${data.body}"></iframe>`;
            duration = 60000;
        } 
        else if (data.type === 'день народження') {
            s.style.background = "linear-gradient(45deg, #ff00cc, #3333ff)";
            s.innerHTML = `<div style="font-size:6vw">🎉</div><div class="text" style="font-size:3.5vw">${data.body}</div><div style="font-size:6vw">🎂</div>`;
            duration = 20000;
        } 
        else {
            const len = data.body.length;
            let fontSize = "2.8vw";
            let cls = "";
            
            if (len > 800) { 
                fontSize = "1.35vw"; 
                cls = "columns"; 
                duration = 50000; 
            } else if (len > 400) { 
                fontSize = "2.1vw"; 
            }

            if (data.bg) s.style.background = `linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)), url(${data.bg}) center/cover`;
            s.innerHTML = `<div class="text ${cls}" style="font-size:${fontSize}">${data.body}</div>`;
        }

        container.appendChild(s);
        index = (index + 1) % slides.length;
        timer = setTimeout(show, duration);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
    }, 1000);
</script>
</body>
</html>
